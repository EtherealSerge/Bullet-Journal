<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4a6fa5">
  <title>Minimalist Bullet Journal</title>
  <link type="image/png" sizes="192x192" rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header with Title and Google Drive Sync Control -->
    <header class="app-header">
      <div class="header-row">
        <h1>📓 Bullet Journal</h1>
        <div class="header-actions">
          <div class="search-container" id="search-container">
            <button id="search-btn" aria-expanded="false" aria-controls="search-expanded" class="search-btn" aria-label="Search entries" title="Search (click or press /)">🔍</button>
            <div class="search-expanded" id="search-expanded">
              <input type="text" id="search-input" class="search-input" placeholder="Search all entries..." aria-label="Search entries">
              <p id="search-status" class="sr-only" role="status"></p>
              <div class="search-results" id="search-results"></div>
            </div>
          </div>
          <button id="sync-btn" class="sync-button" disabled>🔄 Sync with Google Drive</button>
        </div>
      </div>
      <div class="quick-note-bar" id="quick-note-bar">
        <button type="button" class="quick-note-trigger" id="quick-note-trigger" aria-label="Add quick note">+</button>
        <div class="quick-note-input-wrap">
          <input type="text" id="quick-note-input" aria-label="Quick note" placeholder="Quick note..." autocomplete="off">
        </div>
      </div>
      <div class="backup-actions" aria-label="Journal backups">
        <button type="button" id="export-btn">Export backup</button>
        <button type="button" id="import-btn">Import backup</button>
        <button type="button" id="recovery-btn" hidden>Export damaged save</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
      <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
    </header>

    <div class="layout-grid">
      <!-- Left Panel: Interactive Calendar, Monthly Tasks & At-a-Glance Events -->
      <main class="panel">
        <div class="calendar-controls">
          <button id="prev-month" aria-label="Previous Month">&lt;</button>
          <button id="today-cal-btn" class="today-btn">Today</button>
          <h2 id="month-year-display"></h2>
          <button id="next-month" aria-label="Next Month">&gt;</button>
        </div>

        <!-- Desktop Weekday Bar -->
        <div class="calendar-weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <!-- Dynamic Grid Populated by JavaScript -->
        <div id="calendar-grid" class="calendar-grid"></div>

        <hr class="section-divider">

       <!-- Monthly Events At-a-Glance -->
        <h3>📅 Monthly Events At-a-Glance</h3>
        <form id="glance-form" class="task-form">
          <select id="glance-day-select" class="glance-select" aria-label="Select Day">
            <!-- Dynamically populated 1 to 28/30/31 -->
          </select>
          <textarea id="glance-input" aria-label="Event title" rows="1" placeholder="New event title..." required autocomplete="off"></textarea>
          <button type="submit">Add Event</button>
        </form>
        <ul id="glance-list" class="task-list"></ul>

        <hr class="section-divider">

         <!-- Monthly Goals & Tasks -->
        <h3>Monthly Goals and Tasks</h3>
        <form id="monthly-form" class="task-form">
          <textarea id="monthly-input" aria-label="Monthly task or goal" rows="1" placeholder="New monthly task or goal..." required autocomplete="off"></textarea>
          <button type="submit">Add Task</button>
        </form>
        <ul id="monthly-list" class="task-list"></ul>
      </main>

      <!-- Right Panel: Daily Rapid Logging & Symbol Legend -->
      <aside class="panel">
        <!-- Daily Navigation Controls -->
        <div class="daily-controls">
          <button id="prev-day" aria-label="Previous Day">&lt;</button>
          <button id="today-daily-btn" class="today-btn">Today</button>
          <h2 id="selected-date-display">Select a Date</h2>
          <button id="next-day" aria-label="Next Day">&gt;</button>
        </div>
        <p class="panel-subtitle">Daily Log</p>

        <!-- Migration Action Button -->
        <button id="migrate-btn" class="migrate-btn">➡️ Migrate Pending Tasks</button>

        <form id="daily-form" class="task-form">
          <textarea id="daily-input" aria-label="Daily entry" rows="1" placeholder="New daily entry..." required autocomplete="off"></textarea>
          <button type="submit">Add Entry</button>
        </form>

        <!-- Rapid Logging Notation Legend -->
        <div class="symbol-legend">
          <span><strong class="symbol">•</strong> Task</span>
          <span><strong class="symbol">✓</strong> Done</span>
          <span><strong class="symbol">&gt;</strong> Migrated</span>
          <span><strong class="symbol">–</strong> Note</span>
          <span><strong class="symbol">○</strong> Event</span>
        </div>

        <ul id="daily-list" class="task-list"></ul>
      </aside>
    </div>
  </div>

  <!-- Google Identity Services Library -->
  <script src="script.js"></script>
  <script async src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
